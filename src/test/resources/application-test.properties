# Test profile properties
security.jwt.secret=changeit-changeit-changeit-changeit

# In-memory H2 for fast tests
spring.datasource.url=jdbc:h2:mem:loketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate test settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 console during automated tests
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Ensure security logs (401/403) are printed during tests
logging.level.org.loket.authN.security=DEBUG
logging.level.org.springframework.security=INFO

# Include MDC entries in console pattern for tests
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{requestId:-},%X{remoteIp:-}] %msg%n

# Actuator / management settings for tests: explicitly expose endpoints and show health details
# This makes tests deterministic even when multiple profiles are active (e.g., localh2 and test)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
