server.port=8081

spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=system
spring.datasource.password=loket_pwd
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true

# Include MDC entries in console pattern so requestId and remoteIp appear in logs for this profile
logging.level.org.loket.authN.security=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{requestId:-},%X{remoteIp:-}] %msg%n

# Use this profile when running against Oracle
# Run with: -Dspring.profiles.active=oracle or set SPRING_PROFILES_ACTIVE=oracle
