---
# Source: loket-authn/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: loket-authn-loket-config
  labels:
    app.kubernetes.io/name: loket-authn
    app.kubernetes.io/instance: loket
data:
  application-localh2.yaml: |-
---
# Source: loket-authn/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: loket-authn-loket
  labels:
    app.kubernetes.io/name: loket-authn
    app.kubernetes.io/instance: loket
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: loket-authn
    app.kubernetes.io/instance: loket
---
# Source: loket-authn/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loket-authn-loket
  labels:
    app.kubernetes.io/name: loket-authn
    helm.sh/chart: loket-authn-0.1.0
    app.kubernetes.io/instance: loket
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loket-authn
      app.kubernetes.io/instance: loket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loket-authn
        app.kubernetes.io/instance: loket
    spec:
      containers:
        - name: loket-authn
          image: "authzorium:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "localh2"
            - name: SECURITY_JWT_SECRET
              value: "changeit-changeit-changeit-changeit"
            - name: SPRING_DATASOURCE_URL
              value: ""
            - name: SPRING_DATASOURCE_USERNAME
              value: ""
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
            - name: SPRING_CONFIG_LOCATION
              value: "/config/application-localh2.yaml"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: loket-authn-loket-config
